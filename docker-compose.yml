# Docker Compose for CareerPilot — written for later/CI parity.
#
# NOT YET TESTED on the primary Windows dev machine for this project (Docker
# Desktop is not installed there; see docs/implementation-plan.md §0). The
# verified Phase 1 local workflow is native Postgres + venv + npm, documented
# in README.md. Run this through CI or on a machine with Docker before
# relying on it, and update this note once it has been verified.

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: careerpilot
      POSTGRES_PASSWORD: careerpilot_dev_password
      POSTGRES_DB: careerpilot_dev
    ports:
      - "5432:5432"
    volumes:
      - careerpilot_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerpilot -d careerpilot_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://careerpilot:careerpilot_dev_password@db:5432/careerpilot_dev
      TEST_DATABASE_URL: postgresql+psycopg://careerpilot:careerpilot_dev_password@db:5432/careerpilot_test
      LOG_LEVEL: INFO
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      HTTP_TIMEOUT_SECONDS: "10"
      HTTP_MAX_RETRIES: "3"
      HTTP_MIN_REQUEST_INTERVAL_SECONDS: "0.5"
      DISCOVERY_SCHEDULER_ENABLED: "true"
      DISCOVERY_INTERVAL_MINUTES: "180"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  careerpilot_pg_data:
